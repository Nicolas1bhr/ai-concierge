    statement: Delegation cannot silently increase authority.
    status: CANDIDATE_CONSTITUTIONAL
    applies_to: [AuthorityGrant, Delegation, DerivedCredential]
    required_enforcement: { minimum: HARD_WHERE_ENFORCEABLE }
    enforceability: { current: UNKNOWN }
    test_obligations: [property, state_machine, adversarial, differential]
    failure_class: CONSTITUTIONAL_VIOLATION
    notes: ID, applies_to, required_enforcement and test_obligations taken from Contract Program §6.1.

