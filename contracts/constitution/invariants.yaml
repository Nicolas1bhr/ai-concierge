# Constitutional invariant registry — seed
#
# Transcribed verbatim from Foundation v0.2 §28 "Constitutional invariants v0.2" (items 1–22).
# Record shape: Contract Program v0.1 §6.1. Schema: invariant-record.schema.json.
#
# Honesty rule (Contract Program §6.2): every record starts at enforceability UNKNOWN. Nothing is
# enforced yet because nothing is implemented yet. Raising `current` requires evidence.
#
# Test obligations are filled in during Phase 1 (Gate P1: "every Foundation invariant has stable
# ID and test obligations"). Only CF-AUTH-001 carries the obligations given in the Contract
# Program's own §6.1 example. IDs follow the proposed naming rules in adr/0002.

invariants:
  - id: CF-AUTH-002
    title: Capability is not authority
    source: { document: CONCIERGE_FOUNDATION_UNBOUNDED_INSTITUTIONAL_SUBSTRATE_v0.2, section: "28. Constitutional invariants v0.2", item: 1 }
    statement: Cognition does not own institutional authority merely by being capable.
    status: CANDIDATE_CONSTITUTIONAL
    enforceability: { current: UNKNOWN }
    test_obligations: []
    failure_class: CONSTITUTIONAL_VIOLATION

  - id: CF-IDEN-001
    title: Identity concepts remain distinguishable
    source: { document: CONCIERGE_FOUNDATION_UNBOUNDED_INSTITUTIONAL_SUBSTRATE_v0.2, section: "28. Constitutional invariants v0.2", item: 2 }
    statement: Identity, authentication, trust, authority, representation, and credential possession remain distinguishable.
    status: CANDIDATE_CONSTITUTIONAL
    enforceability: { current: UNKNOWN }
    test_obligations: []
    failure_class: CONSTITUTIONAL_VIOLATION

  - id: CF-AUTH-001
